# Rebuilds the HTML sheets and PDFs in en/ and it/ whenever their sources change,
# commits the result back to the branch, and (on main) uploads them to itch.io.
name: Build sheets

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.py"
      - "tools/publish_itch.py"
      - ".github/workflows/build.yml"
  # Adds a "Run workflow" button in the Actions tab (works on any branch).
  workflow_dispatch:
    inputs:
      force_itch:
        description: "Upload every file to itch.io, even unchanged ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-sheets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Google Chrome comes preinstalled on GitHub's Ubuntu runners. No fonts need
      # installing: build.py embeds the fonts from src/fonts/ into every sheet.
      - name: Build HTML and PDFs
        run: python3 build.py --pdf

      - name: Commit regenerated files
        run: |
          git add en it pdf-manifest.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "regenerate sheets from src/"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # ---- itch.io: only on main, and only once the BUTLER_API_KEY secret exists ----
      - name: Check whether to publish to itch.io
        id: itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::notice::Not on main: skipping the itch.io upload."
          elif [ -z "$BUTLER_API_KEY" ]; then
            echo "::notice::No BUTLER_API_KEY secret: skipping the itch.io upload."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install butler
        if: steps.itch.outputs.publish == 'true'
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          rm butler.zip
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Upload to itch.io
        if: steps.itch.outputs.publish == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: python3 tools/publish_itch.py ${{ inputs.force_itch && '--force' || '' }}
