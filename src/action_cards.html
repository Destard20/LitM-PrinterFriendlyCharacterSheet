<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<title>{{title_cards}}</title>
<style>
    /* Fonts embedded by build.py (src/fonts/), so the sheet looks the same on every computer */
{{font_faces}}
    /* Always print backgrounds (white patches behind box titles, shaded headers) */
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Paper: {{paper_name}} ({{paper_w}} x {{paper_h}} mm). Cards: {{card_w}} x {{card_h}} mm (standard trading card), 3 x 3, edge to edge.
       Print at 100% scale, margins "None", background graphics on. */
    @page { size: {{page_size}}; margin: 0; }

    :root {
        --paper-w: {{paper_w}}mm;
        --paper-h: {{paper_h}}mm;
        --grid-x: {{grid_x}}mm;
        --grid-y: {{grid_y}}mm;
        --card-w: {{card_w}}mm;
        --card-h: {{card_h}}mm;
        --border-thick: 3px solid #111;
    }
    body {
        font-family: 'EB Garamond', 'LitM Symbols', 'LitM Scratch', serif;
        font-size: 11.5px;
        background: #eee;
        margin: 0;
        padding: 20px;
        color: #111;
    }
    .page {
        position: relative;
        overflow: hidden;
        background: #fff;
        width: var(--paper-w);
        height: var(--paper-h);
        margin: 0 auto 20px;
        box-sizing: border-box;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    @media print {
        body { background: #fff; padding: 0; margin: 0; }
        .page { box-shadow: none; margin: 0; page-break-after: always; break-after: page; }
        .page:last-child { page-break-after: auto; break-after: auto; }
    }

    /* Card grid */
    .grid {
        position: absolute;
        left: var(--grid-x);
        top: var(--grid-y);
        display: grid;
        grid-template-columns: repeat(3, var(--card-w));
        grid-template-rows: repeat(3, var(--card-h));
    }
    .card {
        width: var(--card-w);
        height: var(--card-h);
        padding: {{card_pad}}mm;
        box-sizing: border-box;
        display: flex;
    }

    /* Cut lines: run across the whole page, landing on the card edges */
    .cut { position: absolute; z-index: 2; pointer-events: none; }
    .cut.v { top: 0; bottom: 0; width: 0; border-left: 0.2mm dashed #888; margin-left: -0.1mm; }
    .cut.h { left: 0; right: 0; height: 0; border-top: 0.2mm dashed #888; margin-top: -0.1mm; }
    .cut-hint {
        position: absolute;
        z-index: 3;
        left: calc(var(--grid-x) + 2mm);
        top: calc(var(--grid-y) / 2);
        transform: translateY(-50%);
        font-size: 8px;
        color: #777;
        background: #fff;
        padding: 0 1.5mm;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    .cut-hint .scissors { font-family: 'LitM Symbols', sans-serif; font-size: 11px; margin-right: 1mm; }

    /* Card box (same look as the hero sheet boxes) */
    .box {
        flex-grow: 1;
        border: var(--border-thick);
        border-radius: 8px;
        padding: 4mm 3mm 2mm;
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: #fdfdfd;
    }
    .box-title {
        position: absolute;
        top: -8px;
        left: 10px;
        background: #fff;
        padding: 0 5px;
        font-weight: bold;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .name-line { border-bottom: 2.5px solid #111; min-height: 7mm; margin-bottom: 1mm; flex-shrink: 0; }
    .section-label { font-size: 8.5px; font-weight: bold; text-transform: uppercase; margin: 1.2mm 0 0.3mm 0; letter-spacing: 1px; color: #000; white-space: nowrap; }
    .tag-row { display: flex; align-items: flex-end; flex-grow: 1; min-height: 4.8mm; }
    .tag-icon { font-size: 11px; margin-right: 5px; margin-bottom: 1px; font-family: 'LitM Symbols', sans-serif; color: #111; }
    .line { border-bottom: 1px solid #999; flex-grow: 1; align-self: stretch; }
    .scratch-mark { width: 11px; height: 11px; border: 1px solid #555; border-radius: 3px; margin-left: 6px; background: #fff; flex-shrink: 0; box-sizing: content-box; }
    .claw-scratch {
        font-family: 'LitM Scratch', sans-serif;
        display: inline-block;
        transform: scaleX(-1) rotate(90deg);
        font-size: 10px;
        font-weight: bold;
        color: #444;
        margin-top: -2px;
    }
</style>
</head>
<body>

    <div class="page">
{{cut_lines}}
    <div class="cut-hint"><span class="scissors">✂</span>{{cut_hint}}</div>
    <div class="grid">
{{cards}}
    </div>
    </div>

</body>
</html>
